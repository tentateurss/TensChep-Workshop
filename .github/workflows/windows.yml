name: Windows portable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.13'
          architecture: x64
      - run: python -m poecraft update
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q poecraft
      - run: |
          python -m venv .build-venv
          .build-venv/Scripts/python.exe -m pip install pyinstaller==6.22.3
          .build-venv/Scripts/python.exe packaging/build_windows.py
      - run: python packaging/smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: |
            dist/TensChep-Workshop-Windows-x64.zip
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-x64
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --prerelease --title "TensChep Workshop v1.0.0 Beta 1" --notes-file docs/RELEASE.md
