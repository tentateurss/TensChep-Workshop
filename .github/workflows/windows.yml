name: Windows portable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.13'
          architecture: x64
      - run: python -m poecraft update
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q poecraft
      - run: |
          python -m venv .build-venv
          .build-venv/Scripts/python.exe -m pip install pyinstaller==6.22.3
          .build-venv/Scripts/python.exe packaging/build_windows.py
      - run: python packaging/smoke_windows.py
      - name: Download published baseline for isolated updater tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .browser-tools/baseline | Out-Null
          gh release download v1.0.0-beta.1 --pattern TensChep-Workshop-Windows-x64.zip --dir .browser-tools/baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          Expand-Archive .browser-tools/baseline/TensChep-Workshop-Windows-x64.zip .browser-tools/baseline/files
          Move-Item .browser-tools/baseline/files/TensChep-Workshop .browser-tools/old-build
      - run: python packaging/test_windows_update.py
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: |
            dist/TensChep-Workshop-Windows-x64.zip
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-x64
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --prerelease --title "TensChep Workshop v1.0.0 Beta 2" --notes-file docs/RELEASE.md
