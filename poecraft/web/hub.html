<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TensChep Workshop</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/hub.css">
</head>
<body class="hub">
<header class="hub-header">
  <!-- the brand is never translated: plain text, no data-i18n -->
  <a class="brand" href="/">TensChep Workshop</a>
  <div class="lang-box">
    <div id="langSelect" class="lang-select" role="group" aria-label="Language"></div>
  </div>
</header>

<main class="hub-main">
  <section class="hub-hero">
    <h1 class="brand-title">TensChep Workshop</h1>
    <p class="tagline" data-i18n="hub.tagline">Tools for Path of Exile crafters</p>
  </section>

  <section>
    <ul id="tools" class="tool-grid" aria-live="polite"></ul>
    <p class="hint more" data-i18n="hub.more">More tools are on the way.</p>
  </section>
<section class="card"><h2 id="updates-title"></h2><p id="updates-status" aria-live="polite"></p>
<select id="updates-channel"><option value="beta">Beta</option><option value="stable">Stable</option></select>
<button id="updates-check" type="button"></button><a id="updates-link" hidden target="_blank" rel="noopener"></a>
<pre id="updates-notes" style="white-space:pre-wrap"></pre></section>
</main>

<footer class="hub-footer muted" data-i18n="hub.footer">Fan-made tools, not affiliated with or endorsed by Grinding Gear Games.</footer>
<script src="/hub.js"></script>
<script src="/updates.js"></script>
</body>
</html>
